 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenvoud Corporation | Jonathan Carela Burgos</title>
    <!-- Se agrega ?v=2 para forzar la lectura del CSS y evitar el fondo blanco -->
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <!-- Barra Superior -->
    <header class="top-bar">
        <div class="left-menu-bar">
            <button class="menu-toggle-btn" id="menu-toggle">⚡ Panel Gestor</button>
        </div>
        <div class="right-action-bar">
            <button class="action-btn" title="Favoritos">📌</button>
            <button class="action-btn" title="Alertas">🔔</button>
            <button class="action-btn" title="Buscar">🔍</button>
        </div>
    </header>

    <!-- Panel Lateral / CMS Dinámico -->
    <nav class="side-menu" id="side-menu">
        <div class="menu-header">
            <h2>Reenvoud OS</h2>
            <button class="close-menu-btn" id="close-menu">&times;</button>
        </div>
        
        <div class="admin-panel-builder">
            <h3>🛠️ Creador Dinámico</h3>
            <div class="form-group">
                <label>Nuevo Departamento:</label>
                <input type="text" id="new-dept-name" placeholder="Ej. Ciberseguridad">
                <button id="add-dept-btn" class="builder-btn">Crear Sección</button>
            </div>
            <div class="form-group">
                <label>Añadir Contenido:</label>
                <select id="block-type">
                    <option value="video">Bloque Multimedia (Video)</option>
                    <option value="text">Bloque de Texto / Artículo</option>
                    <option value="card">Tarjeta de Proyecto</option>
                </select>
                <input type="text" id="block-title" placeholder="Título del bloque">
                <button id="add-block-btn" class="builder-btn">Añadir a la Página</button>
            </div>
        </div>

        <hr class="menu-divider">

        <h3>📂 Departamentos Activos</h3>
        <ul class="menu-links" id="departments-list">
            <li><a href="#inicio">Inicio / Principal</a></li>
            <li><a href="#ia">Inteligencia Artificial</a></li>
            <li><a href="#desarrollo">Desarrollo de Software</a></li>
            <li><a href="#arquitectura">Arquitectura Modular</a></li>
        </ul>
    </nav>

    <!-- Contenedor Principal Dinámico -->
    <div id="dynamic-wrapper">
        <section class="hero-block" id="inicio">
            <div class="media-container">
                <div class="media-placeholder">
                    <p>🎬 Espacio Multimedia Activo</p>
                </div>
            </div>
            <h1>Reenvoud Corporation</h1>
            <p class="founder-subtitle">Fundador: Jonathan Carela Burgos</p>
        </section>
    </div>

    <!-- Contenedor para elementos creados por el usuario -->
    <div id="user-blocks-container"></div>

    <main class="main-content">
        <div id="dynamic-content"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
