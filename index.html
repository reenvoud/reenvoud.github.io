<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenvoud Corporation | Jonathan Carela Burgos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #070707;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 20px;
            background-color: #111111;
            border-bottom: 2px solid #8b0000;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .left-menu-bar {
            display: flex;
            align-items: center;
        }

        .menu-toggle-btn {
            background: linear-gradient(135deg, #8b0000, #500000);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 2px 8px rgba(255, 0, 0, 0.3);
        }

        .right-action-bar {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            background-color: #1a1a1a;
            border: 1px solid #7a0000;
            color: #fff;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .side-menu {
            position: fixed;
            top: 0;
            left: -330px;
            width: 300px;
            height: 100%;
            background-color: #121212;
            border-right: 2px solid #8b0000;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.9);
            overflow-y: auto;
        }

        .side-menu.open {
            left: 0;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #331111;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .menu-header h2 {
            color: #ff4d4d;
            font-size: 1.1rem;
            margin: 0;
        }

        .close-menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.8rem;
            cursor: pointer;
        }

        .admin-panel-builder {
            background-color: #180808;
            border: 1px solid #7a0000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .admin-panel-builder h3, .side-menu h3 {
            color: #ff6666;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #bbb;
            margin-bottom: 3px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            background-color: #050505;
            border: 1px solid #660000;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .builder-btn {
            width: 100%;
            background-color: #a30000;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .builder-btn:hover {
            background-color: #cc0000;
        }

        .menu-divider {
            border: 0;
            border-top: 1px solid #2a0808;
            margin: 15px 0;
        }

        .menu-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .menu-links li {
            margin-bottom: 12px;
        }

        .menu-links a {
            color: #cccccc;
            text-decoration: none;
            font-size: 0.95rem;
            display: block;
            transition: color 0.2s;
        }

        .menu-links a:hover {
            color: #ff4d4d;
        }

        .hero-block {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(180deg, #180505 0%, #070707 100%);
            border-bottom: 1px solid #200808;
        }

        .media-container {
            max-width: 900px;
            margin: 0 auto 20px auto;
        }

        .media-placeholder {
            width: 100%;
            height: 240px;
            background-color: #111;
            border: 2px dashed #8b0000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        h1 {
            color: #ffffff;
            font-size: 2.2rem;
            margin: 10px 0 5px 0;
        }

        .founder-subtitle {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        .dynamic-card {
            max-width: 800px;
            margin: 20px auto;
            background: #111;
            border: 1px solid #550000;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
        }

        .dynamic-card h3 {
            color: #ff4d4d;
            margin-top: 0;
        }

        .main-content {
            padding: 30px 20px;
            text-align: center;
        }

        #dynamic-content {
            color: #ff6666;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <header class="top-bar">
        <div class="left-menu-bar">
            <button class="menu-toggle-btn" id="menu-toggle">⚡ Panel Gestor</button>
        </div>
        <div class="right-action-bar">
            <button class="action-btn" title="Favoritos">📌</button>
            <button class="action-btn" title="Alertas">🔔</button>
            <button class="action-btn" title="Buscar">🔍</button>
        </div>
    </header>

    <!-- Panel Lateral / CMS Dinámico -->
    <nav class="side-menu" id="side-menu">
        <div class="menu-header">
            <h2>Reenvoud OS</h2>
            <button class="close-menu-btn" id="close-menu">&times;</button>
        </div>
        
        <div class="admin-panel-builder">
            <h3>🛠️ Creador Dinámico</h3>
            <div class="form-group">
                <label>Nuevo Departamento:</label>
                <input type="text" id="new-dept-name" placeholder="Ej. Ciberseguridad">
                <button id="add-dept-btn" class="builder-btn">Crear Sección</button>
            </div>
            <div class="form-group">
                <label>Añadir Contenido:</label>
                <select id="block-type">
                    <option value="video">Bloque Multimedia (Video)</option>
                    <option value="text">Bloque de Texto / Artículo</option>
                    <option value="card">Tarjeta de Proyecto</option>
                </select>
                <input type="text" id="block-title" placeholder="Título del bloque">
                <button id="add-block-btn" class="builder-btn">Añadir a la Página</button>
            </div>
        </div>

        <hr class="menu-divider">

        <h3>📂 Departamentos Activos</h3>
        <ul class="menu-links" id="departments-list">
            <li><a href="#inicio">Inicio / Principal</a></li>
            <li><a href="#ia">Inteligencia Artificial</a></li>
            <li><a href="#desarrollo">Desarrollo de Software</a></li>
            <li><a href="#arquitectura">Arquitectura Modular</a></li>
        </ul>
    </nav>

    <!-- Contenedor Principal Dinámico -->
    <div id="dynamic-wrapper">
        <section class="hero-block" id="inicio">
            <div class="media-container">
                <div class="media-placeholder">
                    <p>🎬 Espacio Multimedia Activo</p>
                </div>
            </div>
            <h1>Reenvoud Corporation</h1>
            <p class="founder-subtitle">Fundador: Jonathan Carela Burgos</p>
        </section>
    </div>

    <!-- Contenedor para elementos creados por el usuario -->
    <div id="user-blocks-container"></div>

    <main class="main-content">
        <div id="dynamic-content"></div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggle = document.getElementById("menu-toggle");
            const sideMenu = document.getElementById("side-menu");
            const closeMenu = document.getElementById("close-menu");

            if (menuToggle && sideMenu) {
                menuToggle.addEventListener("click", () => sideMenu.classList.add("open"));
            }

            if (closeMenu && sideMenu) {
                closeMenu.addEventListener("click", () => sideMenu.classList.remove("open"));
            }

            document.addEventListener("click", (event) => {
                if (sideMenu && sideMenu.classList.contains("open")) {
                    if (!sideMenu.contains(event.target) && !menuToggle.contains(event.target)) {
                        sideMenu.classList.remove("open");
                    }
                }
            });

            const addDeptBtn = document.getElementById("add-dept-btn");
            const newDeptInput = document.getElementById("new-dept-name");
            const departmentsList = document.getElementById("departments-list");

            const addBlockBtn = document.getElementById("add-block-btn");
            const blockTypeSelect = document.getElementById("block-type");
            const blockTitleInput = document.getElementById("block-title");
            const userBlocksContainer = document.getElementById("user-blocks-container");

            let savedDepts = JSON.parse(localStorage.getItem("reenvoud_depts")) || [];
            let savedBlocks = JSON.parse(localStorage.getItem("reenvoud_blocks")) || [];

            function renderSavedData() {
                savedDepts.forEach(dept => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.href = `#${dept.toLowerCase().replace(/\s+/g, '-')}`;
                    a.textContent = dept;
                    li.appendChild(a);
                    departmentsList.appendChild(li);
                });

                savedBlocks.forEach(block => {
                    appendBlockToDOM(block.type, block.title);
                });
            }

            function appendBlockToDOM(type, title) {
                const blockDiv = document.createElement("div");
                blockDiv.className = "hero-block dynamic-card";
                
                let contentHTML = "";
                if (type === "video") {
                    contentHTML = `<div class="media-container"><div class="media-placeholder"><p>🎬 [Video] ${title}</p></div></div>`;
                } else if (type === "card") {
                    contentHTML = `<h3>📌 ${title}</h3><p>Módulo de tarjeta interactiva generado desde el panel de Reenvoud OS.</p>`;
                } else {
                    contentHTML = `<h3>📝 ${title}</h3><p>Contenido de texto estructurado y modular.</p>`;
                }

                blockDiv.innerHTML = contentHTML;
                userBlocksContainer.appendChild(blockDiv);
            }

            renderSavedData();

            if (addDeptBtn) {
                addDeptBtn.addEventListener("click", () => {
                    const deptName = newDeptInput.value.trim();
                    if (deptName) {
                        savedDepts.push(deptName);
                        localStorage.setItem("reenvoud_depts", JSON.stringify(savedDepts));

                        const li = document.createElement("li");
                        const a = document.createElement("a");
                        a.href = `#${deptName.toLowerCase().replace(/\s+/g, '-')}`;
                        a.textContent = deptName;
                        li.appendChild(a);
                        departmentsList.appendChild(li);
                        
                        newDeptInput.value = "";
                        alert(`Departamento "${deptName}" creado y guardado.`);
                    }
                });
            }

            if (addBlockBtn) {
                addBlockBtn.addEventListener("click", () => {
                    const type = blockTypeSelect.value;
                    const title = blockTitleInput.value.trim() || "Nuevo Módulo";

                    savedBlocks.push({ type, title });
                    localStorage.setItem("reenvoud_blocks", JSON.stringify(savedBlocks));

                    appendBlockToDOM(type, title);
                    blockTitleInput.value = "";
                    alert("Bloque añadido y sincronizado correctamente.");
                });
            }

            const container = document.getElementById("dynamic-content");
            const fechaActual = new Date().toLocaleDateString('es-ES', { year: 'numeric', month: 'long', day: 'numeric' });
            if (container) {
                container.textContent = `Reenvoud OS Activo - Fecha: ${fechaActual}`;
            }
        });
    </script>
</body>
</html>
