
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reenvoud Corporation | Jonathan Carela Burgos</title>
    <link rel="stylesheet" href="style.css?v=6">
</head>
<body>

    <header class="top-bar">
        <div class="left-menu-bar">
            <button class="menu-toggle-btn" id="menu-toggle">⚡ Panel Gestor Pro</button>
        </div>
        <div class="right-action-bar">
            <button class="action-btn" title="Favoritos">📌</button>
            <button class="action-btn" title="Alertas">🔔</button>
            <button class="action-btn" title="Buscar">🔍</button>
        </div>
    </header>

    <nav class="side-menu" id="side-menu">
        <div class="menu-header">
            <h2>Reenvoud OS - Control</h2>
            <button class="close-menu-btn" id="close-menu">&times;</button>
        </div>
        
        <div class="admin-panel-builder">
            <h3>🛠️ Creador de Áreas / Departamentos</h3>
            <div class="form-group">
                <label>Nombre del Departamento:</label>
                <input type="text" id="new-dept-name" placeholder="Ej. Inteligencia Artificial Pro">
                <button id="add-dept-btn" class="builder-btn">Crear Área</button>
            </div>
            
            <div class="form-group">
                <label>Asignar a Departamento:</label>
                <select id="target-dept-select">
                    <!-- Se llena dinámicamente -->
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de Contenido Profesional:</label>
                <select id="block-type">
                    <option value="article">Página / Artículo Profesional (Blog)</option>
                    <option value="multimedia">Bloque Multimedia Avanzado (Video/3D)</option>
                    <option value="project">Tarjeta de Proyecto o Software</option>
                </select>
                <input type="text" id="block-title" placeholder="Título de la subsección o página">
                <button id="add-block-btn" class="builder-btn">Añadir al Área</button>
            </div>
        </div>

        <hr class="menu-divider">

        <h3>📂 Áreas Activas y Estructura</h3>
        <ul class="menu-links" id="departments-list">
            <!-- Opción fija para volver al inicio -->
            <li>
                <a href="#inicio" id="nav-inicio-link">Inicio / Principal</a>
            </li>
        </ul>
    </nav>

    <!-- Contenedor principal con la vista de inicio activa por defecto -->
    <div id="dynamic-wrapper">
        <section class="view-section active-view hero-block" id="inicio">
            <div class="media-container">
                <div class="media-placeholder">
                    <p>🎬 Espacio Multimedia Principal</p>
                </div>
            </div>
            <h1>Reenvoud Corporation</h1>
            <p class="founder-subtitle">Fundador: Jonathan Carela Burgos</p>
        </section>
    </div>

    <!-- Contenedor donde se generan dinámicamente los departamentos -->
    <div id="departments-content-container"></div>

    <main class="main-content">
        <div id="dynamic-content"></div>
    </main>

    <script src="script.js?v=6"></script>
</body>
</html>
